name: Pipeline Publish & Quality Matrix

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # Continuous Integration Quality Matrix (Executes on every push & pull request)
  # ============================================================================

  test-worker:
    name: Test Worker & Runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev zlib1g-dev libre2-dev pkg-config ninja-build

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl curl zlib re2 pkg-config ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('worker/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y pkgconfiglite ninja
          vcpkg --triplet x64-windows install openssl zlib curl re2

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA_ARGS="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl) -DCMAKE_PREFIX_PATH=$(brew --prefix zlib);$(brew --prefix curl);$(brew --prefix re2)"
          fi
          cmake -B worker/build -S worker -G Ninja -DCMAKE_BUILD_TYPE=Release $EXTRA_ARGS

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B worker/build -S worker -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DUSE_OPEN_SSL=ON -DUSE_MBED_TLS=OFF -DUSE_TLS=ON -DUSE_ZLIB=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Worker Targets
        run: cmake --build worker/build --config Release

      - name: Run Catch2 Test Suite
        run: ctest --test-dir worker/build -C Release --output-on-failure

  test-server:
    name: Test Orchestration Server (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Server Unit & Integration Tests
        run: mvn -f server/pom.xml test

  test-studio:
    name: Test Studio Cockpit (OpenJFX 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install Xvfb (Virtual Framebuffer)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Studio Headless TestFX Tests
        run: |
          xvfb-run -a mvn -f studio/pom.xml test \
            -Dtestfx.robot=glass \
            -Dtestfx.headless=true \
            -Dprism.order=sw \
            -Djava.awt.headless=true

  # ============================================================================
  # Release Please Automation (Only runs on push to master after tests pass)
  # ============================================================================

  release-please:
    name: Release Please (Automated Changelog & SemVer)
    needs: [test-worker, test-server, test-studio]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      worker_release_created: ${{ steps.release.outputs['worker--release_created'] }}
      server_release_created: ${{ steps.release.outputs['server--release_created'] }}
      studio_release_created: ${{ steps.release.outputs['studio--release_created'] }}
      worker_tag_name: ${{ steps.release.outputs['worker--tag_name'] }}
      server_tag_name: ${{ steps.release.outputs['server--tag_name'] }}
      studio_tag_name: ${{ steps.release.outputs['studio--tag_name'] }}
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Run Release Please Action
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ============================================================================
  # Release Artifact Compilation & Publishing (Triggered on Release Creation)
  # ============================================================================

  publish-worker:
    name: Build & Publish Worker Deliverables (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.worker_release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev zlib1g-dev libre2-dev pkg-config ninja-build rpm

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl curl zlib re2 pkg-config ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('worker/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y pkgconfiglite ninja
          vcpkg --triplet x64-windows install openssl zlib curl re2

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA_ARGS="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl) -DCMAKE_PREFIX_PATH=$(brew --prefix zlib);$(brew --prefix curl);$(brew --prefix re2)"
          fi
          cmake -B worker/build -S worker -G Ninja -DCMAKE_BUILD_TYPE=Release $EXTRA_ARGS

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B worker/build -S worker -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DUSE_OPEN_SSL=ON -DUSE_MBED_TLS=OFF -DUSE_TLS=ON -DUSE_ZLIB=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Binaries
        run: cmake --build worker/build --config Release

      - name: Package CPack Installers & Archives
        shell: bash
        run: |
          cd worker/build
          cpack -C Release || true
          mkdir -p ../../dist-worker
          find . -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} ../../dist-worker/ \;

      - name: Bundle Executable Archive (Fallback)
        shell: bash
        run: |
          mkdir -p dist-worker
          ARCHIVE_NAME="legatus-worker-${{ matrix.os }}.tar.gz"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE_NAME="legatus-worker-windows.zip"
            7z a dist-worker/$ARCHIVE_NAME ./worker/build/bin/* ./worker/build/Release/* 2>/dev/null || true
          else
            tar -czf dist-worker/$ARCHIVE_NAME -C worker/build legatus legatusd legatus-runner 2>/dev/null || true
          fi

      - name: Upload Deliverables to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.worker_tag_name }}"
          echo "Uploading deliverables to release tag: $TAG"
          for file in dist-worker/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "$TAG" "$file" --clobber
            fi
          done

  publish-server:
    name: Build & Publish Server Deliverables (Java 21)
    needs: release-please
    if: ${{ needs.release-please.outputs.server_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Production Server JAR
        run: mvn -f server/pom.xml package -DskipTests

      - name: Upload Server JAR to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.server_tag_name }}"
          echo "Uploading server jar to release tag: $TAG"
          for jar in server/target/legatus-server-*.jar; do
            if [ -f "$jar" ] && [[ "$jar" != *"-sources.jar"* ]]; then
              echo "Uploading $jar..."
              gh release upload "$TAG" "$jar" --clobber
            fi
          done

  publish-studio:
    name: Build & Publish Studio Installers (OpenJFX 21)
    needs: release-please
    if: ${{ needs.release-please.outputs.studio_release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Studio Application JAR
        run: mvn -f studio/pom.xml package -DskipTests

      - name: Assemble Studio Native Distribution Archive
        shell: bash
        run: |
          mkdir -p dist-studio
          JAR_FILE=$(find studio/target -maxdepth 1 -name "studio-*.jar" | head -n 1)
          cp "$JAR_FILE" dist-studio/legatus-studio.jar
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a dist-studio/legatus-studio-windows.zip dist-studio/legatus-studio.jar
          else
            tar -czf dist-studio/legatus-studio-${{ matrix.os }}.tar.gz -C dist-studio legatus-studio.jar
          fi

      - name: Upload Studio Deliverables to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.studio_tag_name }}"
          echo "Uploading studio deliverables to release tag: $TAG"
          for file in dist-studio/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "$TAG" "$file" --clobber
            fi
          done
