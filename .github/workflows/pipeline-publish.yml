name: Pipeline Publish

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (Automated Changelog & SemVer)
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      worker_release_created: ${{ steps.release.outputs['worker--release_created'] }}
      server_release_created: ${{ steps.release.outputs['server--release_created'] }}
      studio_release_created: ${{ steps.release.outputs['studio--release_created'] }}
      worker_tag_name: ${{ steps.release.outputs['worker--tag_name'] }}
      server_tag_name: ${{ steps.release.outputs['server--tag_name'] }}
      studio_tag_name: ${{ steps.release.outputs['studio--tag_name'] }}
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-worker:
    name: Build & Publish Worker Deliverables (C++20)
    needs: release-please
    if: ${{ needs.release-please.outputs.worker_release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Release Note Info
        run: |
          echo "Building worker binaries for release: ${{ needs.release-please.outputs.worker_tag_name }}"

  publish-server:
    name: Build & Publish Server Deliverables (Java 21)
    needs: release-please
    if: ${{ needs.release-please.outputs.server_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Release Note Info
        run: |
          echo "Building server JAR for release: ${{ needs.release-please.outputs.server_tag_name }}"

  publish-studio:
    name: Build & Publish Studio Installers (OpenJFX 21)
    needs: release-please
    if: ${{ needs.release-please.outputs.studio_release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Release Note Info
        run: |
          echo "Building studio native packages for release: ${{ needs.release-please.outputs.studio_tag_name }}"
