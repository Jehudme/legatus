name: Pipeline Verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: Conventional Commits Lint (GL-0001)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Commitlint & Config
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Verify Commits on Pull Request
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  verify-docs:
    name: Documentation Drift & Specs Verification (GL-0005, GL-0010)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Verify Specs Contain No Raw Code Blocks (GL-0005)
        run: |
          echo "Auditing docs/specs/ for multi-line implementation code blocks..."
          VIOLATIONS=0
          for file in $(find docs/specs -name "*.md"); do
            # Disallow fenced cpp, java, rust, python blocks in specs (only allow json, yaml, text, mermaid, schema)
            if grep -E "^(\`\`\`cpp|\`\`\`java|\`\`\`rust|\`\`\`python)" "$file"; then
              echo "Error: Forbidden raw implementation code block found in $file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ $VIOLATIONS -gt 0 ]; then
            echo "Failed: $VIOLATIONS spec files violated GL-0005 (zero code blocks invariant)."
            exit 1
          fi
          echo "All subsystem specs comply with GL-0005."

      - name: Verify Broken Markdown Links
        run: |
          echo "Auditing internal documentation links..."
          # Verify local file links point to existing files
          python3 -c "
          import os, re, sys
          errors = 0
          for root, _, files in os.walk('docs'):
              for f in files:
                  if f.endswith('.md'):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8') as handle:
                          content = handle.read()
                      for match in re.findall(r'\[.*?\]\(([^http#][^\)]*?)\)', content):
                          target = match.split('#')[0]
                          if target:
                              resolved = os.path.normpath(os.path.join(root, target))
                              if not os.path.exists(resolved):
                                  print(f'Broken link in {path}: {target} -> {resolved}')
                                  errors += 1
          if errors > 0:
              sys.exit(1)
          print('All internal documentation links verified successfully.')
          "

  verify-worker:
    name: Worker Subsystem CMake & C++20 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Inspect Worker Directory
        run: |
          echo "Worker subsystem ready for Stage 3 implementation (MS-003)."

  verify-server:
    name: Server Subsystem Maven & Java 21 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Inspect Server Directory
        run: |
          echo "Server subsystem ready for Stage 3 implementation (MS-002)."

  verify-studio:
    name: Studio Subsystem OpenJFX 21 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21 & OpenJFX
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Inspect Studio Directory
        run: |
          echo "Studio subsystem ready for Stage 3 implementation (MS-004)."
