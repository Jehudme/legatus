<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="legatusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#18181b" stroke="url(#legatusGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Central L Node Network -->
  <path d="M 35,25 L 35,70 L 68,70" fill="none" stroke="url(#legatusGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Orbiting Telemetry Nodes -->
  <circle cx="35" cy="25" r="4.5" fill="#06b6d4" />
  <circle cx="35" cy="70" r="4.5" fill="#10b981" />
  <circle cx="68" cy="70" r="4.5" fill="#10b981" />
  <circle cx="68" cy="45" r="3.5" fill="#06b6d4" opacity="0.8"/>
  <line x1="68" y1="70" x2="68" y2="45" stroke="#06b6d4" stroke-width="2" stroke-dasharray="2,2"/>
</svg>
